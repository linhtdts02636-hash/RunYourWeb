<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RunYourWeb Canvas Test</title>
<style>
  body{margin:0;font:14px system-ui;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
  form{display:flex;gap:8px;padding:12px;background:#1b1b1b}
  input{flex:1;padding:8px;border-radius:6px;border:1px solid #333;background:#0d0d0d;color:#eee}
  button{padding:8px 16px;border-radius:6px;border:0;background:#6d4fd8;color:#fff;cursor:pointer}
  button:disabled{opacity:.5}
  #status{padding:6px 12px;color:#aaa}
  #canvas{flex:1;margin:0 12px 12px;border:1px solid #333;border-radius:8px;overflow:hidden;background:#000}
  iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<form id="f">
  <input id="repo" value="https://github.com/JackMarines/WEB1044" aria-label="Repository URL">
  <input id="branch" placeholder="branch (optional)" style="flex:0 0 130px" aria-label="Branch">
  <input id="sha" placeholder="commit sha (optional)" style="flex:0 0 150px" aria-label="Commit SHA">
  <input id="token" type="password" placeholder="GitHub token (private repo)" style="flex:0 0 190px" aria-label="GitHub token" autocomplete="off">
  <button id="run">Run</button>
  <button id="stop" type="button" disabled>Stop</button>
</form>
<div id="status">Idle</div>
<div id="canvas"><iframe id="view" title="Running project"></iframe></div>
<script>
const $ = (id) => document.getElementById(id);
let sandboxId = null;
const post = async (path, body) => {
  const r = await fetch(path, { method: "POST", body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
};
$("f").onsubmit = async (e) => {
  e.preventDefault();
  $("run").disabled = true;
  $("status").textContent = "Provisioning → cloning → starting (can take ~1 min)...";
  try {
    const v = (id) => $(id).value.trim() || undefined;
    const r = await post("/boot", {
      repoUrl: v("repo"), branch: v("branch"), sha: v("sha"), token: v("token"),
    });
    $("token").value = "";
    sandboxId = r.sandboxId;
    $("view").src = r.previewUrl;
    $("status").textContent = "Ready: " + r.previewUrl;
    $("stop").disabled = false;
  } catch (err) {
    $("status").textContent = "Failed: " + err.message;
    $("run").disabled = false;
  }
};
$("stop").onclick = async () => {
  await post("/stop", { sandboxId });
  $("view").src = "about:blank";
  $("status").textContent = "Stopped";
  $("stop").disabled = true;
  $("run").disabled = false;
};
</script>
</body>
</html>
